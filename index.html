<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isabella Stryker — Marketing Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --burgundy: #581317;
    --blush: #e5c8cc;
    --warm-cream: #F7F3EE;
    --gold: #C9A373;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--warm-cream);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================
     LANDING SCENE
     ============================================ */
  #landing {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--warm-cream);
    transition: opacity 0.6s ease;
  }

  .landing-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(11px, 1.2vw, 14px);
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--burgundy);
    opacity: 0.65;
    margin-bottom: 52px;
  }

  /* ============================================
     BOOK SCENE
     ============================================ */
  .book-scene {
    perspective: 1400px;
    width: 640px;
    height: 800px;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The full book wrapper — rotates to reveal open state */
  .book-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.05s linear;
  }

  /* ---- CLOSED BOOK ---- */
  .book-closed {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: opacity 0.3s ease;
  }

  /* Book cover — front face */
  .book-front {
    position: absolute;
    inset: 0;
    border-radius: 0;
    overflow: visible;
    box-shadow: none;
    background: transparent;
  }

  .book-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(-4px 8px 24px rgba(88,19,23,0.2)) drop-shadow(4px 12px 32px rgba(0,0,0,0.15));
  }

  /* CSS fallback cover (shows when no image) */
  .book-front-css {
    width: 100%;
    height: 100%;
    background: var(--blush);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px;
  }

  .book-front-css .bs-author {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--burgundy);
    margin-bottom: 8px;
  }

  .book-front-css .bs-initials {
    font-family: 'Cormorant Garamond', serif;
    font-size: 88px;
    font-weight: 700;
    color: var(--burgundy);
    line-height: 1;
    letter-spacing: -3px;
  }

  .book-front-css .book-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--burgundy);
    text-align: center;
    margin-top: 4px;
  }

  .book-front-css .book-script {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-style: italic;
    color: var(--burgundy);
    opacity: 0.65;
    text-align: center;
    margin-top: 32px;
  }

  /* Book spine — hidden, image includes this detail */
  .book-spine {
    display: none;
  }

  /* Book pages (right edge) — hidden, image includes this detail */
  .book-pages-edge {
    display: none;
  }

  /* ---- OPEN BOOK ---- */
  .book-open {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transform-style: preserve-3d;
    width: 560px; /* twice the width — open book is wider */
    left: -140px; /* center it */
    transition: opacity 0.4s ease;
    display: flex;
  }

  .book-page-left,
  .book-page-right {
    width: 50%;
    height: 100%;
    background: #f7f3ee;
    position: relative;
    overflow: hidden;
  }

  .book-page-left {
    border-radius: 3px 0 0 3px;
    box-shadow: -4px 8px 32px rgba(0,0,0,0.15);
    background: linear-gradient(to right, #ede8e1, #f7f3ee);
  }

  .book-page-right {
    border-radius: 0 3px 3px 0;
    box-shadow: 4px 8px 32px rgba(0,0,0,0.15);
    background: linear-gradient(to left, #ede8e1, #f7f3ee);
  }

  /* Printed page content — miniature site preview */
  .page-content {
    padding: 28px 24px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .page-mini-header {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--burgundy);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .page-mini-rule {
    width: 100%;
    height: 1px;
    background: var(--blush);
    margin-bottom: 12px;
  }

  .page-mini-lines {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }

  .page-mini-line {
    height: 2px;
    background: #d6cfc7;
    border-radius: 1px;
  }

  .page-mini-line.short { width: 70%; }
  .page-mini-line.shorter { width: 50%; }
  .page-mini-line.medium { width: 85%; }

  .page-mini-accent {
    width: 40px;
    height: 5px;
    background: var(--blush);
    border-radius: 2px;
    margin-top: 14px;
    margin-bottom: 8px;
  }

  /* Book spine center crease */
  .book-open-spine {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0.04), rgba(0,0,0,0.08));
    z-index: 2;
  }

  /* ============================================
     HOVER HINT
     ============================================ */
  .click-hint {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: opacity 0.4s ease;
  }

  .click-hint span {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--burgundy);
    opacity: 0.5;
  }

  .hint-line {
    width: 1px;
    height: 32px;
    background: var(--burgundy);
    opacity: 0.25;
    animation: hintPulse 2.4s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.15; transform: scaleY(0.6); }
    50%       { opacity: 0.35; transform: scaleY(1); }
  }

  /* ============================================
     ANIMATION STATES
     ============================================ */

  /* State 1: Idle hover tilt */
  .book-scene:hover .book-wrapper {
    transform: rotateY(-8deg) rotateX(3deg);
  }

  /* State 2: Opening — front cover swings left */
  .book-scene.opening .book-closed {
    animation: openCover 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes openCover {
    0%   { transform: rotateY(0deg); opacity: 1; }
    70%  { transform: rotateY(-165deg); opacity: 1; }
    100% { transform: rotateY(-180deg); opacity: 0; }
  }

  /* State 2: Open pages fade in */
  .book-scene.opening .book-open {
    animation: revealOpen 0.9s 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes revealOpen {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }

  /* State 3: Zoom into book */
  .book-scene.zooming {
    animation: zoomIn 1.1s cubic-bezier(0.4, 0, 0.8, 1) forwards;
  }

  @keyframes zoomIn {
    0%   { transform: scale(1); opacity: 1; }
    60%  { transform: scale(3.5); opacity: 1; }
    100% { transform: scale(7); opacity: 0; }
  }

  /* Hide hint during animation */
  .book-scene.opening ~ .click-hint,
  .book-scene.zooming ~ .click-hint {
    opacity: 0;
    pointer-events: none;
  }

  /* Full-page portal overlay */
  #portal-overlay {
    position: fixed;
    inset: 0;
    background: var(--warm-cream);
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.5s ease;
  }

  #portal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  /* ============================================
     ENTRANCE ANIMATION — page load
     ============================================ */
  #landing {
    opacity: 0;
    animation: fadeInLanding 1s 0.3s ease forwards;
  }

  @keyframes fadeInLanding {
    to { opacity: 1; }
  }

  .book-scene {
    opacity: 0;
    transform: translateY(24px);
    animation: riseBook 1s 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes riseBook {
    to { opacity: 1; transform: translateY(0); }
  }

  .click-hint {
    opacity: 0;
    animation: fadeInHint 0.8s 1.4s ease forwards;
  }

  @keyframes fadeInHint {
    to { opacity: 1; }
  }

  /* ============================================
     RESPONSIVE
     ============================================ */
  @media (max-width: 600px) {
    .book-scene {
      width: 340px;
      height: 440px;
    }

    .book-open {
      width: 440px;
      left: -110px;
    }
  }
</style>
</head>
<body>

<div id="portal-overlay"></div>

<div id="landing">
  <p class="landing-name">Isabella Stryker</p>

  <div class="book-scene" id="bookScene" onclick="handleBookClick()">
    <div class="book-wrapper" id="bookWrapper">

      <!-- CLOSED BOOK -->
      <div class="book-closed" id="bookClosed">
        <div class="book-spine"></div>
        <div class="book-front">
          <!-- Book image with transparent background -->
          <img
            src="images/bs-book.png"
            alt="BS Marketing Portfolio"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          >
          <div class="book-front-css" style="display:none;">
            <span class="bs-author">Bella Stryker</span>
            <span class="bs-initials">BS</span>
            <span class="book-subtitle">Marketing Portfolio</span>
            <span class="book-script">Where strategy meets story.</span>
          </div>
        </div>
        <div class="book-pages-edge"></div>
      </div>

      <!-- OPEN BOOK -->
      <div class="book-open" id="bookOpen">
        <div class="book-page-left">
          <div class="page-content">
            <div class="page-mini-header">Isabella Stryker</div>
            <div class="page-mini-rule"></div>
            <div class="page-mini-lines">
              <div class="page-mini-accent"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line short"></div>
              <div class="page-mini-line medium"></div>
              <div class="page-mini-line shorter"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line short"></div>
              <div class="page-mini-line medium"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line shorter"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line short"></div>
            </div>
          </div>
        </div>
        <div class="book-open-spine"></div>
        <div class="book-page-right">
          <div class="page-content">
            <div class="page-mini-lines">
              <div class="page-mini-accent"></div>
              <div class="page-mini-line medium"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line short"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line shorter"></div>
              <div class="page-mini-line medium"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line short"></div>
              <div class="page-mini-line"></div>
              <div class="page-mini-line medium"></div>
              <div class="page-mini-line shorter"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="click-hint">
    <span>Open</span>
    <div class="hint-line"></div>
  </div>
</div>

<script>
  let state = 'idle'; // idle → opening → open → zooming → done

  function handleBookClick() {
    if (state !== 'idle' && state !== 'open') return;

    if (state === 'idle') {
      openBook();
    } else if (state === 'open') {
      enterBook();
    }
  }

  function openBook() {
    state = 'opening';
    const scene = document.getElementById('bookScene');
    const wrapper = document.getElementById('bookWrapper');

    // Remove hover effect during animation
    wrapper.style.transform = 'none';
    wrapper.style.transition = 'none';

    scene.classList.add('opening');

    // After open animation completes, set state to open
    setTimeout(() => {
      state = 'open';
      // Small nudge to indicate clickable again
      scene.style.cursor = 'zoom-in';
    }, 1200);
  }

  function enterBook() {
    state = 'zooming';
    const scene = document.getElementById('bookScene');

    scene.classList.remove('opening');
    scene.classList.add('zooming');

    // Fade in portal overlay slightly before zoom completes
    setTimeout(() => {
      document.getElementById('portal-overlay').classList.add('active');
    }, 750);

    // Navigate to home page
    setTimeout(() => {
      window.location.href = 'home.html';
    }, 1300);
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handleBookClick();
    }
  });
</script>
</body>
</html>
